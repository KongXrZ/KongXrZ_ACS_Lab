<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <main class="container">
      <h1>Student Result</h1>

      <section class="form-section">
        <form id="form">
          <div>
            <p>Name</p>
            <input id="name" placeholder="Enter your name" />
            <p class="error" id="error-name"></p>
          </div>

          <div>
            <p>Email</p>
            <input id="email" placeholder="Enter your email" />
            <p class="error" id="error-email"></p>
          </div>

          <div>
            <p>Score</p>
            <input id="score" placeholder="Enter your score" />
            <p class="error" id="error-score"></p>
          </div>

          <button class="submit-btn">ตรวจผลคะแนน</button>
        </form>
      </section>

      <section class="result-section">
        <p class="inactive" id="result-label">Result</p>
        <p class="result inactive" id="result"></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
