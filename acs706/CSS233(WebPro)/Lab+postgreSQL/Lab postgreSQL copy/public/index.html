<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Course Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
            margin: 0;
            padding: 32px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 6px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 24px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 10px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 180px;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input {
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            width: 100%;
        }

        button {
            padding: 11px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary-button {
            background: #475569;
        }

        .secondary-button:hover {
            background: #334155;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .toolbar h2 {
            margin: 0;
        }

        .status {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 6px;
            background: #e2e8f0;
        }

        .status.success {
            background: #dcfce7;
            color: #166534;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .status.loading {
            background: #dbeafe;
            color: #1e40af;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th,
        td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
        }

        .empty {
            padding: 24px;
            text-align: center;
            color: #64748b;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .form-row {
                flex-direction: column;
                align-items: stretch;
            }

            .field {
                width: 100%;
                min-width: 0;
            }
        }
    </style>

    <script src="/app.js" defer></script>
</head>

<body>
    <main class="container">

        <h1>Course Management</h1>
        <p class="subtitle">
            Web–Database Integration Demo
            (Express + PostgreSQL)
        </p>

        <div id="status" class="status" role="status" aria-live="polite">
            Ready
        </div>

        <!-- Add Course Form -->
        <section class="card">
            <h2>Add New Course</h2>

            <form id="course-form">
                <div class="form-row">

                    <div class="field">
                        <label for="course-name">
                            Course Name
                        </label>
                        <input id="course-name" type="text" maxlength="150" placeholder="e.g. Web Programming"
                            required />
                    </div>

                    <div class="field">
                        <label for="course-credits">
                            Credits
                        </label>
                        <input id="course-credits" type="number" min="1" max="6" step="1" value="3" required />
                    </div>

                    <button id="add-button" type="submit">
                        Add Course
                    </button>

                </div>
            </form>
        </section>

        <!-- Course List -->
        <section class="card">

            <div class="toolbar">
                <h2>Available Courses</h2>

                <button id="refresh-button" class="secondary-button" type="button">
                    Refresh
                </button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Course Name</th>
                        <th>Credits</th>
                    </tr>
                </thead>

                <tbody id="course-list">
                    <!-- Rendered dynamically -->
                </tbody>
            </table>

            <p id="empty-message" class="empty" hidden>
                No courses found.
            </p>

        </section>

    </main>
</body>

</html>
