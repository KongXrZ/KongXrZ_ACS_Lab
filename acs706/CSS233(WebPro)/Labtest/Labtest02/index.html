<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Labtest animation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="stage">
        <h1>Labtest · Publish workflow</h1>
        <p>Every 8 seconds the workflow restarts automatically.</p>
        <div class="track">
            <div class="progress">
            </div>
        </div>
        <div class="steps">
            <div class="step queued">
                <span class="marker">1</span>
                <b>Queued</b>
            </div>
            <div class="step processing">
                <span class="marker">2</span>
                <b>Processing</b>
            </div>
            <div class="step published">
                <span class="marker">3</span>
                <b>Published</b>
            </div>
        </div>
    </div>
</body>

</html>
