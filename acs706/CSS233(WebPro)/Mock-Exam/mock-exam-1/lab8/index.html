<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>โหลดรายชื่อ พร้อมสถานะ Loading / Empty / Error</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container">
      <h1>User Directory</h1>
      <div class="controls">
        <button id="btn-load" type="button">โหลดรายชื่อ</button>
        <button id="btn-empty" type="button">ทดสอบข้อมูลว่าง</button>
        <button id="btn-error" type="button">ทดสอบ Error</button>
      </div>
      <p id="status" aria-live="polite">กดปุ่มเพื่อโหลดข้อมูล</p>
      <ul id="user-list" class="list"></ul>

      <div class="loading" id="loading"></div>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
